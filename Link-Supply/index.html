<!DOCTYPE html>

    <title>Link Supply</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
    <header class="navbar">
        <div class="navbar-container">
            <div class="logo-area">
                <span class="material-symbols-outlined logo-icon">eco</span>
                <div class="logo-text">
                    <div class="brand">Link Supply</div>
                </div>
            </div>
            
            <div class="search-bar">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" placeholder="Cari...">
                <button class="btn-cari">Cari</button>
            </div>

            <div class="nav-actions">
                <div class="location">
                    <span class="material-symbols-outlined">location_on</span>
                    <span>Lokasi</span>
                </div>
                <div class="icon-group">
                    <span class="material-symbols-outlined icon-btn">notifications</span>
                    <span class="material-symbols-outlined icon-btn">shopping_cart</span>
                </div>
                <div class="user-profile">
                    <span class="material-symbols-outlined">storefront</span>
                    <div class="user-text">
                        <div class="placeholder" style="width: 120px; height: 12px; margin-bottom: 4px;"></div>
                        <div class="placeholder" style="width: 80px; height: 12px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="wrapper">
        <main class="main-content">
            <section class="hero-banner">
                <div class="hero-left">
                    <div class="placeholder" style="width: 80%; height: 28px; margin-bottom: 12px;"></div>
                    <div class="placeholder" style="width: 60%; height: 16px;"></div>
                </div>
                <div class="hero-right">
                    <div class="stats-box">
                        <div class="placeholder" style="width: 150px; height: 32px;"></div>
                    </div>
                    <button class="btn-rfq"><span class="material-symbols-outlined">request_quote</span> Penawaran</button>
                </div>
            </section>

            <section class="category-pills">
                <a href="#" class="pill active"><span class="material-symbols-outlined">eco</span> Semua</a>
                <a href="#" class="pill"><span class="material-symbols-outlined">water</span> Water</a>
                <a href="#" class="pill"><span class="material-symbols-outlined">agriculture</span> Agriculture</a>
                <a href="#" class="pill"><span class="material-symbols-outlined">local_dining</span> Local Dining</a>
            </section>
